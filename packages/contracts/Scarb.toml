[package]
name = "facet_contracts"
version = "0.1.0"
edition = "2024_07"
license-file = "../../LICENSE"

[dependencies]
starknet = "2.17.0"
openzeppelin = "3.0.0"

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.17.0"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[lib]

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
panic-backtrace = true

[scripts]
test = "snforge test"

# Live mainnet state. Pinned to the block the findings are measured against so the
# assertions stay reproducible; the anonymizer's last invocation was 13,275,294.
[[tool.snforge.fork]]
name = "MAINNET"
url = "https://api.cartridge.gg/x/starknet/mainnet"
block_id.number = "13329863"

# Sepolia carries the same anonymizer and shadow account classes as mainnet, so the decoded
# payload can be replayed there before it is replayed with real fees.
[[tool.snforge.fork]]
name = "SEPOLIA"
# The versioned path matters: the bare host serves RPC 0.9.0, which snforge 0.59.0 rejects.
url = "https://api.cartridge.gg/x/starknet/sepolia/rpc/v0_10"
block_id.number = "13518500"
