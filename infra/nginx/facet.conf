# The public site's nginx server block, kept in the repository so the deployed routing is
# reviewable rather than living only on the host. Copy to /etc/nginx/sites-available/facet,
# then `nginx -t && systemctl reload nginx`.
#
# Clean paths are canonical; the filename URLs stay as one-hop redirects so older links keep
# working. Certbot manages the listen/ssl lines.
server {
    server_name usefacet.xyz www.usefacet.xyz;

    root /var/www/facet;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The page reads Starknet RPC directly from the visitor's browser, so no upstream
    # is proxied here and nothing on this box is reachable through it.
    # Keep filename URLs as one-hop compatibility redirects; clean paths are canonical.
    location = /proof.html { return 301 /proof; }
    location = /launch.html { return 301 /launch; }
    location = /mainnet-ekubo.html { return 301 /ekubo; }
    location = /mainnet-defi.html { return 301 /endur; }
    location = /mainnet-ekubo-exit.html { return 301 /ekubo-exit; }

    location = /proof {
        try_files /proof.html =404;
    }

    location = /launch {
        try_files /launch.html =404;
    }

    location = /ekubo {
        try_files /mainnet-ekubo.html =404;
    }

    location = /endur {
        try_files /mainnet-defi.html =404;
    }

    location = /ekubo-exit {
        try_files /mainnet-ekubo-exit.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|json)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/usefacet.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/usefacet.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.usefacet.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = usefacet.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name usefacet.xyz www.usefacet.xyz;
    return 404; # managed by Certbot




}